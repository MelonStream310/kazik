<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>МГЕ Слоты</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: #1a1a1a;
            color: white;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        h1 { color: #ffd700; margin-bottom: 5px; text-align: center; }
        .balance-info { font-size: 18px; margin-bottom: 20px; color: #00ff00; }
        .machine {
            background: #333;
            border: 5px solid #555;
            border-radius: 15px;
            padding: 20px;
            display: flex;
            gap: 10px;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
            margin-bottom: 20px;
        }
        .reel {
            width: 80px;
            height: 100px;
            background: #fff;
            border: 3px solid #222;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 50px;
            overflow: hidden;
            position: relative;
        }
        .symbol-container {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            width: 80%;
            max-width: 300px;
        }
        input[type="number"] {
            width: 100%;
            padding: 10px;
            font-size: 20px;
            border-radius: 8px;
            border: none;
            text-align: center;
            background: #444;
            color: white;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 15px;
            font-size: 20px;
            font-weight: bold;
            color: white;
            background: linear-gradient(to bottom, #ff4500, #8b0000);
            border: 2px solid #550000;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 5px 0 #330000;
        }
        button:active { transform: translateY(5px); box-shadow: none; }
        button:disabled { background: gray; box-shadow: none; cursor: not-allowed; transform: translateY(5px); }
        #status { margin-top: 15px; font-size: 18px; font-weight: bold; text-align: center; height: 30px; }
    </style>
</head>
<body>

    <h1>🎰 МГЕ КАЗИНО 🎰</h1>
    <div class="balance-info" id="balanceDisplay">Баланс: ... 👊</div>

    <div class="machine">
        <div class="reel"><div class="symbol-container" id="reel1">🍒</div></div>
        <div class="reel"><div class="symbol-container" id="reel2">🍒</div></div>
        <div class="reel"><div class="symbol-container" id="reel3">🍒</div></div>
    </div>

    <div class="controls">
        <input type="number" id="betInput" placeholder="Ставка" min="1" value="100" inputmode="numeric">
        <button id="spinBtn" onclick="spin()">Дернуть рычаг!</button>
    </div>

    <div id="status"></div>

    <script>
        // !!! ЗАМЕНИ на адрес, который указан в WEBAPP_URL у бота (https, без слэша в конце)
        const API = "https://REPLACE_ME";

        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        const statusEl = document.getElementById('status');
        const spinBtn = document.getElementById('spinBtn');
        let currentBalance = 0;
        let isSpinning = false;

        const symbols = ["🍒", "🍋", "🍇", "🔔", "💎", "7️⃣"];

        function setStatus(text, color) {
            statusEl.innerText = text;
            statusEl.style.color = color || "white";
        }

        function setBalance(value) {
            currentBalance = value;
            document.getElementById('balanceDisplay').innerText = `Баланс: ${value} 👊`;
        }

        // Все запросы идут на сервер, подпись Telegram (initData) подтверждает, кто играет
        async function api(path, payload) {
            const r = await fetch(API + path, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ initData: tg.initData, ...payload })
            });
            let j = {};
            try { j = await r.json(); } catch (e) {}
            if (!r.ok) throw new Error(j.error || "Ошибка соединения");
            return j;
        }

        api("/api/balance", {})
            .then(j => setBalance(j.balance))
            .catch(e => setStatus("❌ " + e.message, "red"));

        function unlock() {
            isSpinning = false;
            spinBtn.disabled = false;
        }

        async function spin() {
            if (isSpinning) return;

            const bet = parseInt(document.getElementById('betInput').value);
            if (isNaN(bet) || bet < 1) return setStatus("❌ Ставка от 1 удара!", "red");
            if (bet > currentBalance) return setStatus("❌ Не хватает обьебонов!", "red");

            isSpinning = true;
            spinBtn.disabled = true;
            setStatus("Крутим...", "white");

            // Результат определяет сервер
            let r;
            try {
                r = await api("/api/slots", { bet });
            } catch (e) {
                setStatus("❌ " + e.message, "red");
                unlock();
                return;
            }

            const reels = [document.getElementById('reel1'), document.getElementById('reel2'), document.getElementById('reel3')];
            const stopAt = [1000, 1500, 2000];

            // Быстрая смена эмодзи, потом поочерёдная остановка на выпавших символах
            const intervals = reels.map(reel => setInterval(() => {
                reel.innerText = symbols[Math.floor(Math.random() * symbols.length)];
            }, 50));

            reels.forEach((reel, i) => {
                setTimeout(() => {
                    clearInterval(intervals[i]);
                    reel.innerText = r.symbols[i];
                }, stopAt[i]);
            });

            setTimeout(() => {
                setBalance(r.balance);
                if (r.win > bet) setStatus(`🎉 ВЫИГРЫШ: +${r.win - bet} 🎰`, "#00ff00");
                else if (r.win === bet) setStatus("⚖️ НИЧЬЯ (Вернули ставку)", "yellow");
                else setStatus("📉 ПРОИГРЫШ", "red");
                unlock();
            }, 2100);
        }
    </script>
</body>
</html>
