<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>МГЕ Слоты</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: #1a1a1a;
            color: white;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        h1 {
            color: #ffd700;
            margin-bottom: 5px;
            text-align: center;
        }

        .balance-info {
            font-size: 18px;
            margin-bottom: 20px;
            color: #00ff00;
        }

        .machine {
            background: #333;
            border: 5px solid #555;
            border-radius: 15px;
            padding: 20px;
            display: flex;
            gap: 10px;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
            margin-bottom: 20px;
        }

        .reel {
            width: 80px;
            height: 100px;
            background: #fff;
            border: 3px solid #222;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 50px;
            overflow: hidden;
            position: relative;
        }

        .symbol-container {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: top 0.1s linear;
        }

        .controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            width: 80%;
            max-width: 300px;
        }

        input[type="number"] {
            width: 100%;
            padding: 10px;
            font-size: 20px;
            border-radius: 8px;
            border: none;
            text-align: center;
            background: #444;
            color: white;
        }

        button {
            width: 100%;
            padding: 15px;
            font-size: 20px;
            font-weight: bold;
            color: white;
            background: linear-gradient(to bottom, #ff4500, #8b0000);
            border: 2px solid #550000;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 5px 0 #330000;
        }

        button:active {
            transform: translateY(5px);
            box-shadow: none;
        }

        button:disabled {
            background: gray;
            box-shadow: none;
            cursor: not-allowed;
            transform: translateY(5px);
        }

        #status {
            margin-top: 15px;
            font-size: 18px;
            font-weight: bold;
            text-align: center;
            height: 30px;
        }
    </style>
</head>
<body>

    <h1>🎰 МГЕ КАЗИНО 🎰</h1>
    <div class="balance-info" id="balanceDisplay">Баланс: 0 👊</div>

    <div class="machine">
        <div class="reel"><div class="symbol-container" id="reel1">🍒</div></div>
        <div class="reel"><div class="symbol-container" id="reel2">🍒</div></div>
        <div class="reel"><div class="symbol-container" id="reel3">🍒</div></div>
    </div>

    <div class="controls">
        <input type="number" id="betInput" placeholder="Ставка" min="1" value="100">
        <button id="spinBtn" onclick="spin()">Дернуть рычаг!</button>
    </div>

    <div id="status"></div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // Получаем баланс из URL
        const urlParams = new URLSearchParams(window.location.search);
        let currentBalance = parseInt(urlParams.get('balance')) || 0;
        document.getElementById('balanceDisplay').innerText = `Баланс: ${currentBalance} 👊`;

        const symbols = ["🍒", "🍋", "🍇", "🔔", "💎", "7️⃣"];
        const weights = [35, 30, 20, 10, 4, 1];

        // Функция выбора символа по вероятностям (как в Python коде)
        function getRandomSymbol() {
            let sum = weights.reduce((a, b) => a + b, 0);
            let rand = Math.random() * sum;
            for (let i = 0; i < symbols.length; i++) {
                if (rand < weights[i]) return symbols[i];
                rand -= weights[i];
            }
            return symbols[0];
        }

        let isSpinning = false;

        function spin() {
            if (isSpinning) return;
            
            const betInput = document.getElementById('betInput');
            const betAmount = parseInt(betInput.value);

            if (isNaN(betAmount) || betAmount < 1) {
                document.getElementById('status').innerText = "❌ Ставка от 1 удара!";
                document.getElementById('status').style.color = "red";
                return;
            }

            if (betAmount > currentBalance) {
                document.getElementById('status').innerText = "❌ Не хватает обьебонов!";
                document.getElementById('status').style.color = "red";
                return;
            }

            isSpinning = true;
            document.getElementById('spinBtn').disabled = true;
            document.getElementById('status').innerText = "Крутим...";
            document.getElementById('status').style.color = "white";

            const r1 = document.getElementById('reel1');
            const r2 = document.getElementById('reel2');
            const r3 = document.getElementById('reel3');

            // Заранее генерируем финальные символы
            const res1 = getRandomSymbol();
            const res2 = getRandomSymbol();
            const res3 = getRandomSymbol();

            // Эффект кручения (быстрая смена эмодзи)
            let intervals = [];
            [r1, r2, r3].forEach((reel, index) => {
                intervals[index] = setInterval(() => {
                    reel.innerText = symbols[Math.floor(Math.random() * symbols.length)];
                }, 50);
            });

            // Поочередная остановка барабанов
            setTimeout(() => {
                clearInterval(intervals[0]);
                r1.innerText = res1;
            }, 1000);

            setTimeout(() => {
                clearInterval(intervals[1]);
                r2.innerText = res2;
            }, 1500);

            setTimeout(() => {
                clearInterval(intervals[2]);
                r3.innerText = res3;
                
                // Считаем выигрыш после остановки 3-го барабана
                finishSpin(res1, res2, res3, betAmount);
            }, 2000);
        }

        function finishSpin(s1, s2, s3, bet) {
            let multiplier = 0;

            if (s1 === s2 && s2 === s3) {
                if (s1 === "7️⃣") multiplier = 50;
                else if (s1 === "💎") multiplier = 15;
                else if (s1 === "🔔") multiplier = 8;
                else multiplier = 4;
            } else if (s1 === s2 || s2 === s3 || s1 === s3) {
                multiplier = 1;
            }

            const winAmount = bet * multiplier;

            if (winAmount > bet) {
                document.getElementById('status').innerText = `🎉 ВЫИГРЫШ: +${winAmount - bet} 🎰`;
                document.getElementById('status').style.color = "#00ff00";
            } else if (winAmount === bet) {
                document.getElementById('status').innerText = `⚖️ НИЧЬЯ (Вернули ставку)`;
                document.getElementById('status').style.color = "yellow";
            } else {
                document.getElementById('status').innerText = `📉 ПРОИГРЫШ`;
                document.getElementById('status').style.color = "red";
            }

            // Отправляем данные обратно в бота
            setTimeout(() => {
                const data = {
                    slot_bet: bet,
                    slot_win: winAmount,
                    s1: s1,
                    s2: s2,
                    s3: s3
                };
                tg.sendData(JSON.stringify(data));
            }, 1500); // Закрываем WebApp через 1.5 секунды после остановки
        }
    </script>
</body>
</html>
